<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN2X - 공부일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: #050505; font-family: 'Inter', 'Noto Sans KR', sans-serif; color: #E0E0E0; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 25px 50px; background: rgba(5, 5, 5, 0.85); 
    border-bottom: 2px solid #FF2A2A; backdrop-filter: blur(5px); 
  }
  .logo a { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: #FFFFFF; text-decoration: none; }
  nav ul { display: flex; list-style: none; gap: 40px; }
  nav ul li a { text-decoration: none; color: #A0A0A0; font-size: 1.1rem; font-weight: 500; transition: color 0.3s ease; }
  nav ul li a:hover { color: #FF2A2A; }

  .study-container { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
  .page-title { font-size: 2rem; color: #FFFFFF; margin-bottom: 40px; border-left: 5px solid #FF2A2A; padding-left: 15px; font-weight: 900; }
  
  .write-box { background-color: #0A0A0A; border: 1px solid #333; padding: 25px; border-radius: 8px; margin-bottom: 40px; }
  .write-box input[type="text"], .write-box input[type="date"], .write-box textarea {
    width: 100%; background-color: #111; border: 1px solid #444; color: #FFF; padding: 12px; margin-bottom: 15px; border-radius: 4px; font-family: inherit;
  }
  .write-box input[type="file"] {
    width: 100%; color: #FFF; background: #111; padding: 10px; border-radius: 4px; border: 1px solid #444; margin-bottom: 15px;
  }
  .write-box textarea { height: 100px; resize: vertical; }
  .input-row { display: flex; gap: 15px; }
  .submit-btn {
    background-color: #FF2A2A; color: #FFF; border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s;
  }
  .submit-btn:hover { background-color: #CC0000; }
  .submit-btn:disabled { background-color: #555; cursor: not-allowed; }

  .log-item { background-color: #111111; border: 1px solid #222; padding: 30px; margin-bottom: 20px; border-radius: 8px; transition: transform 0.2s ease, border-color 0.2s ease; }
  .log-item:hover { transform: translateY(-5px); border-color: #FF2A2A; }
  .log-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .log-date { color: #FF2A2A; font-size: 0.95rem; font-weight: bold; }
  .delete-btn { background-color: transparent; color: #555; border: 1px solid #444; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; }
  .delete-btn:hover { background-color: #CC0000; color: #FFF; border-color: #CC0000; }
  .log-title { font-size: 1.4rem; color: #FFFFFF; margin-bottom: 8px; line-height: 1.4; }
  .log-author { color: #888888; font-size: 0.9rem; margin-bottom: 15px; }
  .log-image { max-width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
  .log-desc { color: #BBBBBB; line-height: 1.7; word-break: keep-all; }
</style>
</head>
<body>

  <header>
    <div class="logo"><a href="index.html">FRAME</a></div>
    <nav>
      <ul>
        <li><a href="study.html" style="color: #FF2A2A;">공부일지</a></li>
        <li><a href="worklog.html">작업일지</a></li>
        <li><a href="rules.html">FSK 대회 규정</a></li>
        <li><a href="etc.html">기타</a></li>
      </ul>
    </nav>
  </header>

  <main class="study-container">
    <h2 class="page-title">공부일지 (Study Log)</h2>
    
    <div class="write-box">
      <div class="input-row">
        <input type="text" id="authorInput" placeholder="작성자 이름">
        <input type="date" id="dateInput">
      </div>
      <input type="text" id="titleInput" placeholder="일지 제목을 입력하세요">
      <textarea id="descInput" placeholder="공부한 내용을 입력하세요"></textarea>
      <!-- 이미지 업로드 칸 -->
      <input type="file" id="imageInput" accept="image/*">
      <button class="submit-btn" id="saveBtn">일지 등록하기</button>
    </div>

    <div id="logsContainer">
      <p style="color: #888; text-align: center;">게시물을 불러오는 중이거나 등록된 일지가 없습니다.</p>
    </div>
  </main>

  <script type="module">
    // Firestore 로직만 불러옵니다 (Storage 제외)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // ★ 여기에 발급받은 ImgBB API 키를 붙여넣으세요 ★
    const IMGBB_API_KEY = "2fd6539d7bc62afc0657749be113a44f";

    const firebaseConfig = {
      apiKey: "AIzaSyBQT5zq1Od_fEycSiAb9-Ne9a2FgEi5ITU",
      authDomain: "frame-0815.firebaseapp.com",
      projectId: "frame-0815",
      storageBucket: "frame-0815.firebasestorage.app",
      messagingSenderId: "855495504446",
      appId: "1:855495504446:web:d46114e7a5606d8898d76f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const author = document.getElementById("authorInput").value;
      const date = document.getElementById("dateInput").value;
      const title = document.getElementById("titleInput").value;
      const desc = document.getElementById("descInput").value;
      const imageFile = document.getElementById("imageInput").files[0]; 
      const saveBtn = document.getElementById("saveBtn");

      if (!author || !date || !title || !desc) {
        alert("내용을 모두 채워주세요!");
        return;
      }
      
      if (imageFile && IMGBB_API_KEY === "IMGBB_API_KEY_HERE") {
        alert("코드 하단에 ImgBB API 키를 먼저 입력해주세요!");
        return;
      }

      try {
        saveBtn.disabled = true; 
        saveBtn.innerText = "업로드 중..."; 

        let imageUrl = null;

        // 1. 이미지가 첨부되었다면 ImgBB 서버로 전송 후 URL 받아오기
        if (imageFile) {
          const formData = new FormData();
          formData.append("image", imageFile);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          if(result.success) {
            imageUrl = result.data.url;
          } else {
            throw new Error("이미지 업로드 실패");
          }
        }

        // 2. 텍스트와 이미지 링크를 함께 데이터베이스에 저장
        await addDoc(collection(db, "studyLogs"), {
          author: author, 
          date: date, 
          title: title, 
          desc: desc, 
          imageUrl: imageUrl, 
          timestamp: new Date()
        });

        alert("일지가 성공적으로 등록되었습니다!");
        window.location.reload(); 
      } catch (e) {
        console.error("등록 중 오류 발생: ", e);
        alert("오류가 발생했습니다. 콘솔을 확인해주세요.");
        saveBtn.disabled = false;
        saveBtn.innerText = "일지 등록하기";
      }
    });

    async function loadLogs() {
      const q = query(collection(db, "studyLogs"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      const container = document.getElementById("logsContainer");
      
      if (!querySnapshot.empty) {
        container.innerHTML = ""; 
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;
          
          const imageTag = data.imageUrl ? `<img src="${data.imageUrl}" class="log-image" alt="첨부 이미지">` : "";

          const logHTML = `
            <div class="log-item">
              <div class="log-top-row">
                <span class="log-date">${data.date}</span>
                <button class="delete-btn" data-id="${docId}">삭제</button>
              </div>
              <h3 class="log-title">${data.title}</h3>
              <div class="log-author">작성자: ${data.author}</div>
              ${imageTag}
              <p class="log-desc">${data.desc.replace(/\n/g, "<br>")}</p>
            </div>
          `;
          container.innerHTML += logHTML;
        });
      }
    }

    document.getElementById("logsContainer").addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete-btn")) {
        const docId = e.target.getAttribute("data-id");
        if (confirm("정말 이 일지를 삭제하시겠습니까?")) {
          try {
            await deleteDoc(doc(db, "studyLogs", docId));
            alert("삭제되었습니다.");
            window.location.reload(); 
          } catch (error) {
            alert("삭제 중 오류가 발생했습니다.");
          }
        }
      }
    });

    loadLogs();
  </script>
</body>
</html>
