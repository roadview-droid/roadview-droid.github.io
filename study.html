<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN2X - 공부일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #050505; font-family: 'Inter', 'Noto Sans KR', sans-serif; color: #E0E0E0;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 25px 50px; background: rgba(5, 5, 5, 0.85); 
    border-bottom: 2px solid #FF2A2A; backdrop-filter: blur(5px); 
  }
  .logo a { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: #FFFFFF; text-decoration: none; }
  nav ul { display: flex; list-style: none; gap: 40px; }
  nav ul li a { text-decoration: none; color: #A0A0A0; font-size: 1.1rem; font-weight: 500; transition: color 0.3s ease; }
  nav ul li a:hover { color: #FF2A2A; }

  .study-container { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
  .page-title { font-size: 2rem; color: #FFFFFF; margin-bottom: 40px; border-left: 5px solid #FF2A2A; padding-left: 15px; font-weight: 900; }
  
  /* 글쓰기 입력 폼 스타일 */
  .write-box {
    background-color: #0A0A0A; border: 1px solid #333; padding: 25px; border-radius: 8px; margin-bottom: 40px;
  }
  .write-box input, .write-box textarea {
    width: 100%; background-color: #111; border: 1px solid #444; color: #FFF; padding: 12px; margin-bottom: 15px; border-radius: 4px; font-family: inherit;
  }
  .write-box textarea { height: 100px; resize: vertical; }
  .input-row { display: flex; gap: 15px; }
  .submit-btn {
    background-color: #FF2A2A; color: #FFF; border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s;
  }
  .submit-btn:hover { background-color: #CC0000; }

  /* 불러온 일지 스타일 */
  .log-item { background-color: #111111; border: 1px solid #222; padding: 30px; margin-bottom: 20px; border-radius: 8px; transition: transform 0.2s ease, border-color 0.2s ease; }
  .log-item:hover { transform: translateY(-5px); border-color: #FF2A2A; }
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .subject-tag { background-color: #1E50A0; color: #FFFFFF; padding: 4px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
  .log-date { color: #FF2A2A; font-size: 0.95rem; font-weight: bold; }
  .log-title { font-size: 1.4rem; color: #FFFFFF; margin-bottom: 15px; line-height: 1.4; }
  .log-desc { color: #BBBBBB; line-height: 1.7; word-break: keep-all; }
</style>
</head>
<body>

  <header>
    <div class="logo"><a href="index.html">FRAME</a></div>
    <nav>
      <ul>
        <li><a href="study.html" style="color: #FF2A2A;">공부일지</a></li>
        <li><a href="worklog.html">작업일지</a></li>
        <li><a href="rules.html">FSK 대회 규정</a></li>
        <li><a href="etc.html">기타</a></li>
      </ul>
    </nav>
  </header>

  <main class="study-container">
    <h2 class="page-title">공부일지 (Study Log)</h2>
    
    <!-- 글쓰기 영역 -->
    <div class="write-box">
      <div class="input-row">
        <input type="text" id="subjectInput" placeholder="과목명 (예: 일반물리학)">
        <input type="date" id="dateInput">
      </div>
      <input type="text" id="titleInput" placeholder="일지 제목을 입력하세요">
      <textarea id="descInput" placeholder="공부한 내용을 입력하세요"></textarea>
      <button class="submit-btn" id="saveBtn">일지 등록하기</button>
    </div>

    <!-- 데이터베이스에서 불러온 일지가 표시될 공간 -->
    <div id="logsContainer">
      <p style="color: #888; text-align: center;">게시물을 불러오는 중이거나 등록된 일지가 없습니다.</p>
    </div>
  </main>

  <!-- 파이어베이스 및 자바스크립트 로직 -->
  <script type="module">
    // Firebase SDK 불러오기
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // 회원님의 Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyBQT5zq1Od_fEycSiAb9-Ne9a2FgEi5ITU",
      authDomain: "frame-0815.firebaseapp.com",
      projectId: "frame-0815",
      storageBucket: "frame-0815.firebasestorage.app",
      messagingSenderId: "855495504446",
      appId: "1:855495504446:web:d46114e7a5606d8898d76f"
    };

    // Firebase 초기화 및 DB 연결
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 데이터 저장하기 (등록 버튼 클릭 시)
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const subject = document.getElementById("subjectInput").value;
      const date = document.getElementById("dateInput").value;
      const title = document.getElementById("titleInput").value;
      const desc = document.getElementById("descInput").value;

      if (!subject || !date || !title || !desc) {
        alert("모든 칸을 채워주세요!");
        return;
      }

      try {
        await addDoc(collection(db, "studyLogs"), {
          subject: subject,
          date: date,
          title: title,
          desc: desc,
          timestamp: new Date() // 정렬을 위한 시간 저장
        });
        alert("일지가 성공적으로 등록되었습니다!");
        window.location.reload(); // 등록 후 페이지 새로고침
      } catch (e) {
        console.error("Error adding document: ", e);
        alert("등록 중 오류가 발생했습니다.");
      }
    });

    // 데이터 불러오기 (페이지 로드 시)
    async function loadLogs() {
      const q = query(collection(db, "studyLogs"), orderBy("timestamp", "desc")); // 최신순 정렬
      const querySnapshot = await getDocs(q);
      const container = document.getElementById("logsContainer");
      
      if (!querySnapshot.empty) {
        container.innerHTML = ""; // 기존 로딩 메시지 지우기
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          // HTML 구조 생성
          const logHTML = `
            <div class="log-item">
              <div class="log-header">
                <span class="subject-tag">${data.subject}</span>
                <span class="log-date">${data.date}</span>
              </div>
              <h3 class="log-title">${data.title}</h3>
              <p class="log-desc">${data.desc.replace(/\n/g, "<br>")}</p>
            </div>
          `;
          container.innerHTML += logHTML;
        });
      }
    }

    // 페이지가 열리면 즉시 불러오기 함수 실행
    loadLogs();
  </script>
</body>
</html>
