<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN2X Frame Part</title>
<style>
  /* 기본 설정 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background-color: #050505; /* 완전한 검은색에 가까운 배경 */
    color: #FFFFFF;
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 1. 상단 네비게이션 바 (Header) */
  header {
    display: flex;
    justify-content: space-between; /* 양끝으로 배치 */
    align-items: center;
    padding: 25px 50px;
    background: transparent;
  }

  /* 왼쪽 로고 (FRAME) */
  .logo {
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: #FFFFFF;
  }

  /* 오른쪽 메뉴들 */
  nav ul {
    display: flex;
    list-style: none;
    gap: 40px; /* 메뉴 사이 간격 */
  }

  nav ul li a {
    text-decoration: none;
    color: #A0A0A0;
    font-size: 1.1rem;
    font-weight: 500;
    transition: color 0.3s ease;
  }

  nav ul li a:hover {
    color: #FF2A2A; /* 마우스 올렸을 때 포인트 컬러 */
  }

  /* 2. 메인 콘텐츠 영역 (타이포그래피 중심) */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-bottom: 50px;
  }

  /* 중앙 RUN2X 텍스트 - 사진이 없어진 만큼 더 크고 웅장하게 설정 */
  .team-name {
    font-size: 8rem; /* 6rem에서 8rem으로 확대 */
    font-weight: 900;
    letter-spacing: 20px; /* 자간 확대 */
    text-transform: uppercase;
    background: linear-gradient(180deg, #FFFFFF 0%, #444444 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; /* 텍스트에 은은한 그라데이션 적용 */
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); /* 텍스트에 약간의 깊이감 부여 */
  }
</style>
</head>
<body>

  <!-- 상단 영역 -->
  <header>
    <div class="logo">FRAME</div>
    <nav>
      <ul>
        <li><a href="#">공부일지</a></li>
        <li><a href="#">작업일지</a></li>
        <li><a href="#">FSK 대회 규정</a></li>
        <li><a href="#">기타</a></li>
      </ul>
    </nav>
  </header>

  <!-- 메인 타이포그래피 영역 (사진 제거됨) -->
  <main>
    <h1 class="team-name">RUN2X</h1>
  </main>

</body>
</html>
