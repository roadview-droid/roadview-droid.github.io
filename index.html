<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN2X Frame Part</title>
<style>
  /* 기본 설정 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background-color: #050505; /* 완전한 검은색에 가까운 배경 */
    color: #FFFFFF;
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 1. 상단 네비게이션 바 (Header) */
  header {
    display: flex;
    justify-content: space-between; /* 양끝으로 배치 */
    align-items: center;
    padding: 25px 50px;
    background: transparent;
  }

  /* 왼쪽 로고 (FRAME) */
  .logo {
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: #FFFFFF;
  }

  /* 오른쪽 메뉴들 */
  nav ul {
    display: flex;
    list-style: none;
    gap: 40px; /* 메뉴 사이 간격 */
  }

  nav ul li a {
    text-decoration: none;
    color: #A0A0A0;
    font-size: 1.1rem;
    font-weight: 500;
    transition: color 0.3s ease;
  }

  nav ul li a:hover {
    color: #FF2A2A; /* 마우스 올렸을 때 포인트 컬러 */
  }

  /* 2. 메인 콘텐츠 영역 (자동차 사진 + RUN2X) */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-bottom: 50px;
  }

  /* 자동차 프레임 이미지 영역 - 새로운 이미지에 맞게 스타일 조정 */
  .car-image-container {
    width: 100%;
    max-width: 900px; /* 사진 최대 크기 */
    margin-bottom: 20px;
    background-color: #FFFFFF; /* 흰색 배경 이미지를 그대로 사용하기 위해 컨테이너 배경 추가 */
    border-radius: 12px;
    overflow: hidden; /* 테두리 반경이 적용되도록 */
    box-shadow: 0 20px 50px rgba(255, 255, 255, 0.1); /* 검은 배경에 미묘한 흰색 그림자 */
  }

  .car-image-container img {
    width: 100%;
    height: auto;
    object-fit: contain; /* 이미지 비율 유지하며 컨테이너에 맞춤 */
    display: block; /* 이미지 아래 공백 제거 */
  }

  /* 하단 RUN2X 텍스트 */
  .team-name {
    font-size: 6rem; /* 텍스트 크기 아주 크게 */
    font-weight: 900;
    letter-spacing: 15px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #FFFFFF 0%, #555555 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; /* 텍스트에 은은한 그라데이션 적용 */
    margin-top: -30px; /* 사진과 살짝 겹치게(혹은 가깝게) 배치하여 역동성 부여 */
  }
</style>
</head>
<body>

  <!-- 상단 영역 -->
  <header>
    <div class="logo">FRAME</div>
    <nav>
      <ul>
        <li><a href="#">공부일지</a></li>
        <li><a href="#">작업일지</a></li>
        <li><a href="#">FSK 대회 규정</a></li>
        <li><a href="#">기타</a></li>
      </ul>
    </nav>
  </header>

  <!-- 메인 이미지 및 타이포그래피 영역 -->
  <main>
    <div class="car-image-container">
  <!-- src 안의 파일명을 실제 파일명으로 수정 -->
    <img src="RUN2X 프레임 사진.png" alt="RUN2X Formula Frame Chassis">
  </div>
    <h1 class="team-name">RUN2X</h1>
  </main>

</body>
</html>
