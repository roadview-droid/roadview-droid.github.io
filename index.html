<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN2X Frame Part</title>
<style>
  /* 기본 설정 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background-color: #050505;
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 1. 상단 네비게이션 바 */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 50px;
    background: rgba(5, 5, 5, 0.85); 
    border-bottom: 2px solid #FF2A2A; 
    backdrop-filter: blur(5px); 
    z-index: 10;
  }

  .logo {
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: #FFFFFF;
  }

  nav ul {
    display: flex;
    list-style: none;
    gap: 40px;
  }

  nav ul li a {
    text-decoration: none;
    color: #A0A0A0;
    font-size: 1.1rem;
    font-weight: 500;
    transition: color 0.3s ease;
  }

  nav ul li a:hover {
    color: #FF2A2A;
  }

  /* 2. 흐릿한 배경 적용 */
  .blurred-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('RUN2X 사진.png'); 
    background-size: cover;
    background-position: center;
    filter: blur(8px);
    z-index: -1;
    opacity: 0.6;
    /* 배경이 부드럽게 선명해지도록 애니메이션 추가 */
    transition: filter 0.5s ease, opacity 0.5s ease;
  }

  /* ★ 복구됨: RUN2X 글씨에 마우스를 올리면 배경이 선명해지는 효과 ★ */
  body:has(.team-name:hover) .blurred-background {
    filter: blur(0px); /* 흐림 효과 0으로 제거 */
    opacity: 1; /* 원래 밝기로 복구 */
  }

  /* 3. 텍스트 컨테이너 */
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  /* 중앙 RUN2X 텍스트 */
  .team-name {
    font-size: 8rem;
    font-weight: 900;
    letter-spacing: 20px;
    text-transform: uppercase;
    color: #FFFFFF;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    -webkit-text-stroke: 4px #8A2BE2; /* 보라색 테두리 */
    cursor: default;
    /* 글씨가 부드럽게 사라지도록 애니메이션 추가 */
    transition: opacity 0.4s ease; 
  }

  /* ★ RUN2X 글씨에 마우스를 올리면 글씨가 사라지는 효과 ★ */
  .team-name:hover {
    opacity: 0; 
  }
</style>
</head>
<body>

  <!-- 배경 div -->
  <div class="blurred-background"></div>

  <!-- 상단 창(Header) -->
  <header>
    <div class="logo">FRAME</div>
    <nav>
      <ul>
        <li><a href="#">공부일지</a></li>
        <li><a href="#">작업일지</a></li>
        <li><a href="#">FSK 대회 규정</a></li>
        <li><a href="#">기타</a></li>
      </ul>
    </nav>
  </header>

  <!-- 메인 타이포그래피 영역 -->
  <main>
    <h1 class="team-name">RUN2X</h1>
  </main>

</body>
</html>
