<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN2X Frame Part</title>
<style>
  /* 기본 설정 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background-color: #050505; /* 어두운 배경 유지 */
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center; /* 수평 중앙 */
    align-items: center; /* 수직 중앙 */
    position: relative; /* 배경 div를 위해 필요 */
  }

  /* ★ 흐릿한 배경 적용 ★ */
  .blurred-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('RUN2X 사진.png'); /* ★ 배경으로 image_4.png 사용 ★ */
    background-size: cover;
    background-position: center;
    filter: blur(25px); /* ★ 흐림 정도를 강하게 (25px) ★ */
    z-index: -1; /* 글자 뒤로 배치 */
    opacity: 0.8; /* 배경을 약간 더 어둡게 하여 흰색 텍스트와 대조를 높임 */
  }

  /* 텍스트 컨테이너 (main) */
  main {
    text-align: center;
  }

  /* 중앙 RUN2X 텍스트 - 흐릿한 배경 위에 가독성 극대화 */
  .team-name {
    font-size: 8rem;
    font-weight: 900;
    letter-spacing: 20px;
    text-transform: uppercase;
    color: #FFFFFF; /* ★ 깨끗한 흰색으로 변경하여 가독성 극대화 ★ */
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); /* 그림자 강화 */
    /* 이전의 그라데이션은 흐릿한 배경 위에선 가독성을 해칠 수 있어 깨끗한 흰색으로 변경 */
  }
</style>
</head>
<body>

  <!-- ★ 흐릿한 배경 div ★ -->
  <div class="blurred-background"></div>

  <!-- 상단 창(Header) 제거됨 -->

  <!-- 메인 타이포그래피 영역 (사진 카드 제거됨) -->
  <main>
    <h1 class="team-name">RUN2X</h1>
  </main>

</body>
</html>
