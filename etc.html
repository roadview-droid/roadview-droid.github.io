<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN2X - 기타</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: #050505; font-family: 'Inter', 'Noto Sans KR', sans-serif; color: #E0E0E0; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; background: rgba(5, 5, 5, 0.85); border-bottom: 2px solid #FF2A2A; backdrop-filter: blur(5px); }
  .logo a { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: #FFFFFF; text-decoration: none; }
  nav ul { display: flex; list-style: none; gap: 40px; }
  nav ul li a { text-decoration: none; color: #A0A0A0; font-size: 1.1rem; font-weight: 500; transition: color 0.3s ease; }
  nav ul li a:hover { color: #FF2A2A; }
  .study-container { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
  .title-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .page-title { font-size: 2rem; color: #FFFFFF; border-left: 5px solid #FF2A2A; padding-left: 15px; font-weight: 900; }
  .toggle-btn { background-color: #222; color: #E0E0E0; border: 1px solid #444; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
  .toggle-btn:hover { background-color: #FF2A2A; border-color: #FF2A2A; color: #FFF; }
  .write-box { background-color: #0A0A0A; border: 1px solid #333; padding: 25px; border-radius: 8px; margin-bottom: 40px; }
  .write-box input[type="text"], .write-box input[type="date"], .write-box input[type="password"] { width: 100%; background-color: #111; border: 1px solid #444; color: #FFF; padding: 12px; margin-bottom: 15px; border-radius: 4px; font-family: inherit; }
  .input-row { display: flex; gap: 15px; }
  .ql-toolbar.ql-snow { border: 1px solid #444; background: #111; border-radius: 4px 4px 0 0; }
  .ql-container.ql-snow { border: 1px solid #444; border-top: none; height: 400px; border-radius: 0 0 4px 4px; font-family: inherit; font-size: 1rem; color: #FFF; margin-bottom: 15px; }
  .ql-snow .ql-stroke { stroke: #E0E0E0; }
  .ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill { fill: #E0E0E0; }
  .ql-snow .ql-picker { color: #E0E0E0; }
  .ql-snow .ql-picker-options { background-color: #222; border-color: #444; }
  .submit-btn { background-color: #FF2A2A; color: #FFF; border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
  .submit-btn:hover { background-color: #CC0000; }
  .submit-btn:disabled { background-color: #555; cursor: not-allowed; }
  .board-list { border-top: 2px solid #555; border-bottom: 1px solid #333; }
  .board-header { display: flex; padding: 15px 20px; background-color: #111; font-weight: bold; color: #A0A0A0; border-bottom: 1px solid #444; }
  .board-row { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid #222; background-color: #050505; transition: background 0.2s; }
  .board-row:hover { background-color: #111; }
  .col-title { flex: 1; font-size: 1.1rem; color: #FFF; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; }
  .col-title:hover { text-decoration: underline; color: #FF2A2A; }
  .col-author { width: 120px; text-align: center; color: #888; font-size: 0.95rem; }
  .col-date { width: 120px; text-align: center; color: #FF2A2A; font-size: 0.95rem; font-weight: bold; }
  .col-action { width: 80px; text-align: center; }
  .log-content-box { display: none; padding: 40px; background-color: #0A0A0A; border-bottom: 1px solid #333; border-left: 3px solid #FF2A2A; }
  .log-desc { color: #DDDDDD; line-height: 1.7; word-break: keep-all; font-size: 1.05rem; }
  .log-desc img { max-width: 100%; border-radius: 8px; margin: 15px 0; border: 1px solid #333; }
  .delete-btn { background-color: transparent; color: #555; border: 1px solid #444; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; }
  .delete-btn:hover { background-color: #CC0000; color: #FFF; border-color: #CC0000; }
</style>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">FRAME</a></div>
    <nav>
      <ul>
        <li><a href="study.html">공부일지</a></li>
        <li><a href="worklog.html">작업일지</a></li>
        <li><a href="rules.html">FSK 대회 규정</a></li>
        <li><a href="etc.html" style="color: #FF2A2A;">기타</a></li>
      </ul>
    </nav>
  </header>
  <main class="study-container">
    <div class="title-header">
      <h2 class="page-title">기타 (Etc)</h2>
      <button id="toggleWriteBtn" class="toggle-btn">새 글 작성</button>
    </div>
    <div class="write-box" id="writeBox" style="display: none;">
      <div class="input-row">
        <input type="text" id="authorInput" placeholder="작성자 이름">
        <input type="date" id="dateInput">
        <input type="password" id="passwordInput" placeholder="삭제용 비밀번호">
      </div>
      <input type="text" id="titleInput" placeholder="제목을 입력하세요">
      <div id="editor"></div>
      <button class="submit-btn" id="saveBtn">게시물 등록하기</button>
    </div>
    <div id="logsContainer">
      <p style="color: #888; text-align: center; margin-top: 50px;">게시물을 불러오는 중이거나 등록된 내용이 없습니다.</p>
    </div>
  </main>
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    const IMGBB_API_KEY = "2fd6539d7bc62afc0657749be113a44f";
    const firebaseConfig = { apiKey: "AIzaSyBQT5zq1Od_fEycSiAb9-Ne9a2FgEi5ITU", authDomain: "frame-0815.firebaseapp.com", projectId: "frame-0815", storageBucket: "frame-0815.firebasestorage.app", messagingSenderId: "855495504446", appId: "1:855495504446:web:d46114e7a5606d8898d76f" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const toggleBtn = document.getElementById("toggleWriteBtn");
    const writeBox = document.getElementById("writeBox");
    toggleBtn.addEventListener("click", () => {
      if (writeBox.style.display === "none") { writeBox.style.display = "block"; toggleBtn.innerText = "작성 취소"; toggleBtn.style.backgroundColor = "#555"; toggleBtn.style.borderColor = "#555"; } 
      else { writeBox.style.display = "none"; toggleBtn.innerText = "새 글 작성"; toggleBtn.style.backgroundColor = "#222"; toggleBtn.style.borderColor = "#444"; }
    });
    const quill = new Quill('#editor', {
      theme: 'snow', placeholder: '내용과 사진을 자유롭게 입력하세요...',
      modules: { toolbar: { container: [ [{ 'size': ['small', false, 'large', 'huge'] }], [{ 'color': [] }], ['bold', 'italic', 'underline', 'strike'], ['image', 'link'], [{ 'list': 'ordered'}, { 'list': 'bullet' }] ], handlers: { image: imageHandler } } }
    });
    function imageHandler() {
      const input = document.createElement('input'); input.setAttribute('type', 'file'); input.setAttribute('accept', 'image/*'); input.click();
      input.onchange = async () => {
        const file = input.files[0]; if (!file) return;
        const formData = new FormData(); formData.append("image", file);
        try {
          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
          const result = await response.json();
          if (result.success) { const url = result.data.url; const range = quill.getSelection(true) || { index: quill.getLength() }; quill.insertEmbed(range.index, 'image', url); quill.setSelection(range.index + 1); } 
          else { alert("이미지 업로드에 실패했습니다."); }
        } catch (error) { alert("업로드 중 오류가 발생했습니다."); }
      };
    }
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const author = document.getElementById("authorInput").value; const date = document.getElementById("dateInput").value; const password = document.getElementById("passwordInput").value; const title = document.getElementById("titleInput").value; const descHTML = quill.root.innerHTML; 
      const isEmpty = quill.getText().trim().length === 0 && !descHTML.includes('<img');
      if (!author || !date || !password || !title || isEmpty) { alert("비밀번호를 포함한 모든 내용을 채워주세요!"); return; }
      const saveBtn = document.getElementById("saveBtn"); saveBtn.disabled = true; saveBtn.innerText = "업로드 중..."; 
      try {
        await addDoc(collection(db, "etcLogs"), { author: author, date: date, password: password, title: title, descHTML: descHTML, timestamp: new Date() });
        alert("성공적으로 등록되었습니다!"); window.location.reload(); 
      } catch (e) { alert("오류가 발생했습니다."); saveBtn.disabled = false; saveBtn.innerText = "게시물 등록하기"; }
    });
    async function loadLogs() {
      const q = query(collection(db, "etcLogs"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q); const container = document.getElementById("logsContainer");
      if (!querySnapshot.empty) {
        let listHTML = `<div class="board-list"><div class="board-header"><div class="col-title">제목</div><div class="col-author">작성자</div><div class="col-date">날짜</div><div class="col-action">관리</div></div>`;
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data(); const docId = docSnap.id;
          const imageTag = data.imageUrl ? `<img src="${data.imageUrl}" class="log-image" alt="첨부 이미지">` : "";
          listHTML += `<div class="board-row"><div class="col-title toggle-title" data-target="${docId}">${data.title}</div><div class="col-author">${data.author}</div><div class="col-date">${data.date}</div><div class="col-action"><button class="delete-btn" data-id="${docId}" data-pw="${data.password || ''}">삭제</button></div></div><div class="log-content-box" id="content-${docId}">${imageTag}<div class="log-desc">${data.descHTML || (data.desc ? data.desc.replace(/\n/g, "<br>") : "")}</div></div>`;
        });
        listHTML += `</div>`; container.innerHTML = listHTML;
      }
    }
    document.getElementById("logsContainer").addEventListener("click", async (e) => {
      if (e.target.classList.contains("toggle-title")) {
        const targetId = e.target.getAttribute("data-target"); const contentBox = document.getElementById(`content-${targetId}`);
        contentBox.style.display = contentBox.style.display === "block" ? "none" : "block";
      }
      if (e.target.classList.contains("delete-btn")) {
        const docId = e.target.getAttribute("data-id"); const realPassword = e.target.getAttribute("data-pw"); 
        if (realPassword) { const userInput = prompt("게시물을 삭제하려면 비밀번호를 입력하세요:"); if (userInput === null) return; if (userInput !== realPassword) { alert("비밀번호가 일치하지 않습니다."); return; } } 
        else { if (!confirm("이 게시물은 비밀번호가 없습니다. 정말 삭제하시겠습니까?")) return; }
        try { await deleteDoc(doc(db, "etcLogs", docId)); alert("삭제되었습니다."); window.location.reload(); } catch (error) { alert("삭제 중 오류가 발생했습니다."); }
      }
    });
    loadLogs();
  </script>
</body>
</html>
